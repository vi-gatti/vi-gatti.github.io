<!--meta {"title": "Contato · Virginia Candido Gatti", "description": "Contato e links profissionais de Virginia Candido Gatti.", "section": "contact", "script": false} -->
  <main id="main">

    <header class="page-intro wrap">
      <p class="label">Contato</p>
      <div class="grid">
        <div class="col-full"><h1>Contato</h1></div>
      </div>
    </header>

    <section class="section section--tight band" aria-labelledby="links-title">
      <div class="wrap grid">
        <div class="col-aside"><h2 class="label" id="links-title">Links</h2></div>
        <div class="col-main">
          <ul class="contact-links">
            <li><a href="{{phone_href}}"><span>Telefone</span><span class="meta">{{phone_display}}</span></a></li>
            <li><a href="{{whatsapp_href}}"><span>WhatsApp</span><span class="meta">{{phone_display}}</span></a></li>
            <li><a href="{{linkedin_href}}"><span>LinkedIn</span><span class="meta">linkedin.com/in/virginia-gatti</span></a></li>
            <li><a href="{{email_href}}"><span>E-mail</span><span class="meta">{{email}}</span></a></li>
          </ul>
        </div>
      </div>
    </section>

    <section class="section section--tight" aria-labelledby="details-title">
      <div class="wrap grid">
        <div class="col-aside"><h2 class="label" id="details-title">Informações</h2></div>
        <div class="col-main">
          <dl class="facts facts--grid">
            <div><dt>Localização</dt><dd>{{location}}</dd></div>
            <div><dt>Fuso horário</dt><dd>Horário da Europa Central (CET, UTC+1)</dd></div>
          </dl>
        </div>
      </div>
    </section>

  </main>
