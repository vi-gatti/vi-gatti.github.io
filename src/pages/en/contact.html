<!--meta {"title": "Contact · Virginia Candido Gatti", "description": "Contact details and professional links for Virginia Candido Gatti.", "section": "contact", "script": false} -->
  <main id="main">

    <header class="page-intro wrap">
      <p class="label">Contact</p>
      <div class="grid">
        <div class="col-full"><h1>Contact</h1></div>
      </div>
    </header>

    <section class="section section--tight band" aria-labelledby="links-title">
      <div class="wrap grid">
        <div class="col-aside"><h2 class="label" id="links-title">Links</h2></div>
        <div class="col-main">
          <ul class="contact-links">
            <li><a href="{{phone_href}}"><span>Phone</span><span class="meta">{{phone_display}}</span></a></li>
            <li><a href="{{whatsapp_href}}"><span>WhatsApp</span><span class="meta">{{phone_display}}</span></a></li>
            <li><a href="{{linkedin_href}}"><span>LinkedIn</span><span class="meta">linkedin.com/in/virginia-gatti</span></a></li>
            <li><a href="{{email_href}}"><span>Email</span><span class="meta">{{email}}</span></a></li>
          </ul>
        </div>
      </div>
    </section>

    <section class="section section--tight" aria-labelledby="details-title">
      <div class="wrap grid">
        <div class="col-aside"><h2 class="label" id="details-title">Details</h2></div>
        <div class="col-main">
          <dl class="facts facts--grid">
            <div><dt>Based in</dt><dd>{{location}}</dd></div>
            <div><dt>Time zone</dt><dd>Central European Time (CET, UTC+1)</dd></div>
          </dl>
        </div>
      </div>
    </section>

  </main>
