<!--meta {"title": "Contact · Virginia Candido Gatti", "description": "Contact Virginia Candido Gatti by email, WhatsApp or LinkedIn.", "section": "contact", "script": false} -->
  <main id="main">
    <section class="wrap contact-page" aria-labelledby="contact-title">
      <header class="contact-page__head">
        <h1 id="contact-title">Get in touch</h1>
        <p class="lede">Open to conversations about people, markets, products and experiences.</p>
      </header>
      <div class="contact-page__body">
        <figure class="contact-page__art">
          {{svg:contact|Abstract line illustration: six overlapping circles forming a flower, inside a dotted circle.}}
        </figure>
        <div class="contact-page__info">
          <ul class="contact-rows">
            <li>
              <span class="contact-rows__label">Email</span>
              <a class="contact-rows__value" href="{{email_href}}">{{email}}</a>
              <button class="contact-rows__action copy-btn" type="button" data-copy="{{email}}" data-done="Copied" aria-label="Copy email address" title="Copy email address"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2"/><path d="M15.5 8.5V6a1.5 1.5 0 0 0-1.5-1.5H6A1.5 1.5 0 0 0 4.5 6v8A1.5 1.5 0 0 0 6 15.5h2.5"/></svg><span class="copy-btn__msg" aria-live="polite"></span></button>
            </li>
            <li>
              <span class="contact-rows__label">WhatsApp</span>
              <a class="contact-rows__value" href="{{whatsapp_href}}">{{phone_display}}</a>
              <a class="contact-rows__action" href="{{phone_href}}" aria-label="Call {{phone_display}}" title="Call"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 5 5L14 13l5 2v3a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg></a>
            </li>
            <li>
              <span class="contact-rows__label">LinkedIn</span>
              <a class="contact-rows__value" href="{{linkedin_href}}">linkedin.com/in/virginia-gatti</a>
              <a class="contact-rows__action" href="{{linkedin_href}}" aria-label="Open LinkedIn profile" title="Open LinkedIn profile"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 16L16 8M9 8h7v7"/></svg></a>
            </li>
          </ul>
          <p class="contact-page__place"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Valencian Community, Spain</p>
        </div>
      </div>
    </section>
  </main>
