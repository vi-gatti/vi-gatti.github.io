<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
{{alternates}}  <link rel="icon" href="{{root}}assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="{{root}}assets/fonts/inter-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{root}}assets/css/main.css">
  <script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
  <script src="{{root}}assets/js/theme.js" defer></script>
{{scripts}}</head>
<body>
  <a class="skip-link" href="#main">{{skip}}</a>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="wordmark" href="index.html">Virginia Candido Gatti</a>
      <div class="site-header__nav">
        <nav aria-label="{{nav_label}}">
          <ul class="nav">
{{nav}}
          </ul>
        </nav>
        <nav aria-label="{{lang_label}}">
          <ul class="lang">
{{langs}}
          </ul>
        </nav>
        <button class="theme-toggle" type="button" aria-pressed="false">
          <span class="theme-toggle__icon" aria-hidden="true"></span>
          <span class="visually-hidden">{{theme}}</span>
        </button>
      </div>
    </div>
  </header>

{{main}}

  <footer class="site-footer band">
    <div class="wrap">
      <div class="site-footer__main">
        <div class="site-footer__who">
          <p class="site-footer__name">Virginia Candido Gatti</p>
          <p class="site-footer__place"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 1 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>{{location}}</p>
        </div>
        <ul class="site-footer__links">
          <li><a href="{{phone_href}}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 5 5L14 13l5 2v3a2 2 0 0 1-2 2A15 15 0 0 1 3 6a2 2 0 0 1 2-2z"/></svg><span>{{phone_display}}</span></a></li>
          <li><a href="{{whatsapp_href}}" aria-label="WhatsApp" title="WhatsApp"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l1.3-3.9A8 8 0 1 1 8 18.8z"/><path d="M9.2 8.6c-.4 2.9 2.6 6 5.4 5.6l.6-1.5-1.7-.9-.9.8a3.6 3.6 0 0 1-1.9-1.9l.8-.9-.9-1.7z"/></svg></a></li>
          <li><a href="{{email_href}}" aria-label="Email: {{email}}" title="{{email}}"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2"/><path d="M4 7l8 6 8-6"/></svg></a></li>
          <li><a href="{{linkedin_href}}" aria-label="LinkedIn" title="LinkedIn"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M8 10.5V16M12 16v-3.2a2 2 0 0 1 4 0V16M12 10.5V16"/><circle cx="8" cy="7.8" r=".6"/></svg></a></li>
        </ul>
      </div>
      <div class="site-footer__legal">
        <p>© {{year}} Virginia Candido Gatti</p>
      </div>
    </div>
  </footer>
</body>
</html>
